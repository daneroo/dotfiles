# yaml-language-server: $schema=./config.schema.json

# Configuration for package managers
# - Homebrew (formulae and casks)
# - mise (versioned tools)
# - npm (global packages)

homebrew:
  # This section manages brew formulae and casks
  # - Commented out unused with # lines
  # - Sorted by basename (naturally sorted as tap info is after the comma)
  # - Properly separates casks from formulae
  # - Fully qualified formulae are written as: "basename, tap/path/"
  #   Example: "speedtest, teamookla/speedtest/" -> "teamookla/speedtest/speedtest"
  # - Moved Python stuff to its own section
  formulae:
    bootstrap:
      # What reconfig itself needs: go builds it, stow links core/ into ~,
      # and mise and node (for npm) run the commands it prints
      - go
      - mise
      - node
      - stow

    main:
      - act
      - asciinema
      - aws-iam-authenticator
      - awscli
      # azure-cli
      # azure/draft/draft
      # azure/functions/azure-functions-core-tools@3
      - b3sum
      - bash
      - bash-completion@2
      # bun is managed by mise
      # bun, oven-sh/bun/
      # Installed from Homebrew, bun's own completion would load at shell start
      # and shadow the corrected one reconfig writes
      - caddy
      # cmake is for local whisper-cpp build
      - cmake
      - coreutils
      - cue
      - deno
      - difftastic
      - direnv
      # docker-slim's project has been renamed to slimtoolkit
      # - docker-slim
      # - doctl
      # Elixir: To get proper :observer.start to work
      # brew reinstall --build-from-source wxwidgets
      - elixir
      - exercism
      - eza
      - ffmpeg
      - findutils
      - fio
      - gh
      - git
      # - glances
      - gnu-tar
      - gum
      # heroku/brew/heroku
      # heroku/brew/heroku-node
      # - helm
      # - ipfs # renamed to kubo
      - hunk # tui git diff viewer
      - jhead
      - jq
      - just
      # - k6
      # - kind
      # - kompose
      # - kube-ps1
      # - kubectx
      # - int128/kubelogin/kubelogin
      # - kubernetes-cli
      # - kustomize
      - kubo # the new ipfs
      - lazygit
      - westpoint-io/lazyrsync/lazyrsync # discovered from homebrew tap naming convention
      - libpq
      - nats-io/nats-tools/nats
      # - neovim
      - netlify-cli
      # Nix formatter (RFC 166 standard). From brew rather than a nix profile:
      # VSCode's nix.formatterPath is editor-global, so it needs a binary that
      # is always on PATH, not one scoped to a project devshell.
      - nixfmt
      - ntfy
      - pnpm # using this instead of npm install -g pnpm
      - pstree
      - pulumi
      - rsync
      # rustup
      # - skaffold
      - sops
      - teamookla/speedtest/speedtest
      - sqlite
      - starship
      # - stern
      - supabase/tap/supabase
      - syncthing
      # my new virtual machine manager - collima too?
      # cirruslabs/cli/tart - removed because unused and formula outdated
      # tinygo is for im-zone tinygo WASM build
      - tinygo-org/tools/tinygo
      - tree
      # wasm-pack is for im-zone rust WASM build
      - wasm-pack
      - watch
      - wget
      - yq
      - yt-dlp

    ai:
      - gemini-cli
      - herdr
      - llmfit
      # - opencode # use tap below instead - macOS and Linux (official brew formula, updated less)
      # - openai-whisper # no longer using : not sure if we ever did
      - anomalyco/tap/opencode # macOS and Linux (recommended, always up to date)
      - whisper.cpp # renamed from whisper-cpp
      # Alternative to whisper-cpp (As in MacWhisper) - removed because it was causing monotonicity violations
      # - whisperkit-cli

    sysmon:
      # System monitoring, diagnostics - network, storage, processes
      - asitop
      - bandwhich
      - btop
      - ctop
      - doggo
      - dua-cli
      - dust
      - fzf
      - hey
      - htop
      - hyperfine
      - iftop
      # should I keep iperf as well as iperf3?
      - iperf
      - iperf3
      - mole

    python:
      - black
      - flake8
      - pipenv
      - poetry
      - ruff
      - uv
      - virtualenv

  casks:
    - 1password-cli
    # For Gadgetbridge - removing until I get back to it!
    # - android-platform-tools
    - audacity
    - balenaetcher
    - calibre
    - chatgpt # openai desktop - was codex-app
    - claude # anthropic desktop
    # brew install --cask claude-code@latest ??
    - claude-code@latest # anthropic cli - track latest!
    - codex # openai cl1
    # codexbar: prefer OpenUsage.app
    # - steipete/tap/codexbar
    - ghostty
    - google-drive
    - livebook
    - losslesscut
    - macwhisper
    # Moonlioght is a streaming client for Sunshine (I us it on omarchy)
    - moonlight
    - opencode-desktop
    # same as codexbar - with less bugs!
    - openusage
    - pearcleaner
    - rustdesk
    - stats
    # Theo's agent harness - not quite yet
    # - t3-code
    - visual-studio-code
    - vlc
    # Previously Microsoft Remote Desktop
    - windows-app

mise:
  # Versioned tools: one version spec, or a list whose first is the default.
  # Mise interprets each spec, for example:
  # - "latest": the newest release
  # - "lts": the newest long-term support release, for tools that have one (node)
  # - "3.12": the newest 3.12.x release; "3.12.15": exactly that version
  bun: ["latest"]
  python: ["3.14"]

npm:
  # agentic opencode helper seems broken with npm - so I used bun
  # - agentic-cli
  # - corepack - deprecated
  - eslint
  #  - moved to gemini-cli formula
  # - "@google/gemini-cli"
  - json
  - npm
  - nx
  - opencode-antigravity-auth
  - pino-pretty
  - serve
  - standard
  - typescript
  - vercel
